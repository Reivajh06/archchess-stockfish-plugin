name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: bash scripts/fetch-stockfish.sh
      - run: mvn -B package
      - uses: softprops/action-gh-release@v2
        with:
          files: target/stockfish.jar
          generate_release_notes: true
